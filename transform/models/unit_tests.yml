unit_tests:
  - name: pvlive_keeps_latest_revision_and_shifts_to_period_start
    description: Two revisions of the same half-hour collapse to the newest; datetime_gmt (period end) becomes period start minus 30 min.
    model: silver_pvlive
    given:
      - input: ref('bronze_pvlive')
        rows:
          - {area_id: gsp0, datetime_gmt: "2024-06-01 12:30:00", generation_mw: 8000, updated_gmt: "2024-06-01 13:00:00", capacity_mwp: 15000, _source_file: a.json}
          - {area_id: gsp0, datetime_gmt: "2024-06-01 12:30:00", generation_mw: 8200, updated_gmt: "2024-06-02 09:00:00", capacity_mwp: 15000, _source_file: b.json}
          - {area_id: pes16, datetime_gmt: "2024-06-01 12:30:00", generation_mw: 600, updated_gmt: "2024-06-01 13:00:00", capacity_mwp: 1200, _source_file: c.json}
    expect:
      rows:
        - {area_id: gsp0, period_start_utc: "2024-06-01 12:00:00", generation_mw: 8200, updated_gmt: "2024-06-02 09:00:00", n_versions: 2}
        - {area_id: pes16, period_start_utc: "2024-06-01 12:00:00", generation_mw: 600, updated_gmt: "2024-06-01 13:00:00", n_versions: 1}

  - name: national_dedup_prefers_row_with_actual
    description: When chunks overlap, the copy that has an actual value wins over one where actual is still null.
    model: silver_ci_national
    given:
      - input: ref('bronze_ci_national')
        rows:
          - {period_start_utc: "2024-06-01 12:00:00", period_end_utc: "2024-06-01 12:30:00", forecast_gco2_kwh: 150, actual_gco2_kwh: 140, intensity_index: moderate, _source_file: a.json}
          - {period_start_utc: "2024-06-01 12:00:00", period_end_utc: "2024-06-01 12:30:00", forecast_gco2_kwh: 151, actual_gco2_kwh: null, intensity_index: moderate, _source_file: z.json}
    expect:
      rows:
        - {period_start_utc: "2024-06-01 12:00:00", forecast_gco2_kwh: 150, actual_gco2_kwh: 140}

  - name: forecast_accuracy_mae_is_mean_absolute_error
    description: "Errors of +10, -20 and 0 give MAE 10, bias -3.33, RMSE sqrt(500/3) = 12.91."
    model: gold_forecast_accuracy
    given:
      - input: ref('silver_forecast_errors')
        rows:
          - {period_start_utc: "2024-06-01 12:00:00", forecast_gco2_kwh: 100, actual_gco2_kwh: 110, error_gco2_kwh: 10, abs_error_gco2_kwh: 10, local_date: "2024-06-01", local_hour: 13, local_month: 6, wind_perc: 10, wind_regime: "low wind (<20%)"}
          - {period_start_utc: "2024-06-01 12:30:00", forecast_gco2_kwh: 120, actual_gco2_kwh: 100, error_gco2_kwh: -20, abs_error_gco2_kwh: 20, local_date: "2024-06-01", local_hour: 13, local_month: 6, wind_perc: 50, wind_regime: "high wind (40%+)"}
          - {period_start_utc: "2024-06-01 13:00:00", forecast_gco2_kwh: 90, actual_gco2_kwh: 90, error_gco2_kwh: 0, abs_error_gco2_kwh: 0, local_date: "2024-06-01", local_hour: 14, local_month: 6, wind_perc: 50, wind_regime: "high wind (40%+)"}
    expect:
      rows:
        - {grouping: overall, group_key: all, n: 3, mae: 10.0, bias: -3.33, rmse: 12.91, mae_pct_of_mean: 10.0}
        - {grouping: month, group_key: "2024-06", n: 3, mae: 10.0, bias: -3.33, rmse: 12.91, mae_pct_of_mean: 10.0}
        - {grouping: local_hour, group_key: "13", n: 2, mae: 15.0, bias: -5.0, rmse: 15.81, mae_pct_of_mean: 14.3}
        - {grouping: local_hour, group_key: "14", n: 1, mae: 0.0, bias: 0.0, rmse: 0.0, mae_pct_of_mean: 0.0}
        - {grouping: wind_regime, group_key: "low wind (<20%)", n: 1, mae: 10.0, bias: 10.0, rmse: 10.0, mae_pct_of_mean: 9.1}
        - {grouping: wind_regime, group_key: "high wind (40%+)", n: 2, mae: 10.0, bias: -10.0, rmse: 14.14, mae_pct_of_mean: 10.5}

  - name: demand_settlement_periods_convert_to_utc_across_clock_change
    description: "Spring-forward day 2026-03-29: period 1 = 00:00 GMT, period 3 = 02:00 BST = 01:00 UTC. Summer: period 1 = 00:00 BST = 23:00 UTC the day before. Forecast rows are dropped."
    model: silver_demand
    given:
      - input: ref('bronze_neso_demand')
        rows:
          - {settlement_date: "2026-03-29", settlement_period: 1, national_demand_mw: 20000, forecast_actual: A, _source_file: a.csv}
          - {settlement_date: "2026-03-29", settlement_period: 3, national_demand_mw: 21000, forecast_actual: A, _source_file: a.csv}
          - {settlement_date: "2026-07-01", settlement_period: 1, national_demand_mw: 18000, forecast_actual: A, _source_file: a.csv}
          - {settlement_date: "2026-07-01", settlement_period: 2, national_demand_mw: 99999, forecast_actual: F, _source_file: a.csv}
    expect:
      rows:
        - {period_start_utc: "2026-03-29 00:00:00", national_demand_mw: 20000}
        - {period_start_utc: "2026-03-29 01:00:00", national_demand_mw: 21000}
        - {period_start_utc: "2026-06-30 23:00:00", national_demand_mw: 18000}
